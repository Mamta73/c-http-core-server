<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom C Web Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #007acc; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
        .tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Custom HTTP Web Server</h1>
        <p>Welcome! This server was built from scratch in <strong>C Language</strong> using Socket Programming and POSIX Multi-threading (<code>pthreads</code>).</p>
        <span class="tag">Status: 200 OK</span>
    </div>
</body>
</html>
